{% extends "base.html" %}
{% block title %}{{ action }} Subject{% endblock %}
{% block breadcrumb %}
  <li class="breadcrumb-item"><a href="{{ url_for('subject_list') }}">Subjects</a></li>
  <li class="breadcrumb-item active">{{ action }}</li>
{% endblock %}

{% block content %}
<div style="max-width:480px" class="fade-in">
  <div class="page-header">
    <h1 class="page-title">{{ action }} Subject</h1>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post" action="{% if subject %}{{ url_for('subject_edit', subject_code=subject.subject_code) }}{% else %}{{ url_for('subject_create') }}{% endif %}">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" name="title" value="{{ subject.title if subject else '' }}" class="form-control" placeholder="Subject title" required />
        </div>

        <div class="form-group">
          <label class="form-label">Department</label>
          <select name="department_id" class="form-select">
            <option value="">-- Select Department --</option>
            {% for d in departments %}
            <option value="{{ d.id }}" {% if subject and subject.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Credits</label>
          <input type="number" name="credits" value="{{ subject.credits if subject else 3 }}" min="1" max="10" class="form-control" required />
        </div>

        <div class="form-group">
          <div style="display:flex;align-items:center;gap:.5rem">
            <input type="checkbox" name="is_active" class="form-check-input" value="true" {% if not subject or subject.is_active %}checked{% endif %} />
            <label class="form-label" style="margin:0;cursor:pointer">Active</label>
          </div>
        </div>

        <div class="divider"></div>
        <div style="display:flex;gap:.75rem;justify-content:flex-end">
          <a href="{{ url_for('subject_list') }}" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
