{% extends "base.html" %}
{% block title %}{{ action }} Department{% endblock %}
{% block breadcrumb %}
  <li class="breadcrumb-item"><a href="{{ url_for('department_list') }}">Departments</a></li>
  <li class="breadcrumb-item active">{{ action }}</li>
{% endblock %}

{% block content %}
<div style="max-width:480px" class="fade-in">
  <div class="page-header"><h1 class="page-title">{{ action }} Department</h1></div>
  <div class="card">
    <div class="card-body">
      <form method="post" action="{% if dept %}{{ url_for('department_edit', pk=dept.id) }}{% else %}{{ url_for('department_create') }}{% endif %}">
        <div class="form-group">
          <label class="form-label">Department Name *</label>
          <input type="text" name="name" value="{{ dept.name if dept else '' }}" class="form-control" placeholder="e.g. Computer Science" required />
        </div>

        <div class="form-group">
          <label class="form-label">Code *</label>
          <input type="text" name="code" value="{{ dept.code if dept else '' }}" class="form-control" placeholder="e.g. CS" required />
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ dept.description if dept else '' }}</textarea>
        </div>

        <div class="divider"></div>
        <div style="display:flex;gap:.75rem;justify-content:flex-end">
          <a href="{{ url_for('department_list') }}" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
