{% extends "base.html" %}
{% block title %}{{ action }} Attendance{% endblock %}
{% block breadcrumb %}
  <li class="breadcrumb-item"><a href="{{ url_for('attendance_list') }}">Attendance</a></li>
  <li class="breadcrumb-item active">{{ action }}</li>
{% endblock %}

{% block content %}
<div style="max-width:520px;" class="fade-in">
  <div class="page-header">
    <h1 class="page-title">{{ action }} Attendance Record</h1>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post" action="{% if record %}{{ url_for('attendance_edit', pk=record.id) }}{% else %}{{ url_for('attendance_create') }}{% endif %}">
        <div class="form-group">
          <label class="form-label">Student *</label>
          <select name="student_id" class="form-select" required>
            <option value="">-- Select Student --</option>
            {% for s in students %}
            <option value="{{ s.student_id }}" {% if record and record.student_id == s.student_id %}selected{% endif %}>{{ s.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Subject *</label>
          <select name="subject_id" class="form-select" required>
            <option value="">-- Select Subject --</option>
            {% for s in subjects %}
            <option value="{{ s.subject_code }}" {% if record and record.subject_id == s.subject_code %}selected{% endif %}>{{ s.title }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Date *</label>
          <input type="date" name="lecture_date" value="{{ record.lecture_date if record else '' }}" class="form-control" required />
        </div>

        <div class="form-group">
          <label class="form-label">Status *</label>
          <select name="status" class="form-select" required>
            <option value="Present" {% if record and record.status == 'Present' %}selected{% endif %}>Present</option>
            <option value="Absent" {% if record and record.status == 'Absent' %}selected{% endif %}>Absent</option>
            <option value="Late" {% if record and record.status == 'Late' %}selected{% endif %}>Late</option>
            <option value="Excused" {% if record and record.status == 'Excused' %}selected{% endif %}>Excused</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Remarks</label>
          <textarea name="remarks" class="form-control" rows="2">{{ record.remarks if record else '' }}</textarea>
        </div>

        <div class="divider"></div>
        <div style="display:flex;gap:.75rem;justify-content:flex-end">
          <a href="{{ url_for('attendance_list') }}" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
